<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learning Chinese: daily review, quizzes, dialogues and stroke-order writing practice for beginner Chinese.">
<meta name="theme-color" content="#1e6b58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learning Chinese">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Learning Chinese</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one column workbook. Every character sits in a 田字格 practice box like the class sheets. */
:root{
  --paper:#f7f8f6; --card:#ffffff; --ink:#1d2321; --muted:#5d6763; --line:#dde2df;
  --grid:#e2a2a2; --grid-soft:#f1d3d3;
  --jade:#1e6b58; --jade-soft:#e2efe9; --ok:#1e7a46; --ok-soft:#e1f2e7; --bad:#b3362d; --bad-soft:#f8e3e0;
  --hanzi:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141917; --card:#1c2320; --ink:#e7ece9; --muted:#9aa6a1; --line:#2e3834;
  --grid:#8a4b4b; --grid-soft:#4a3030;
  --jade:#6cc4a8; --jade-soft:#1f3a32; --ok:#6fd39a; --ok-soft:#1d3a29; --bad:#f08a80; --bad-soft:#47231f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141917; --card:#1c2320; --ink:#e7ece9; --muted:#9aa6a1; --line:#2e3834;
  --grid:#8a4b4b; --grid-soft:#4a3030;
  --jade:#6cc4a8; --jade-soft:#1f3a32; --ok:#6fd39a; --ok-soft:#1d3a29; --bad:#f08a80; --bad-soft:#47231f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h1 .zh{font-family:var(--hanzi);font-weight:700;margin-right:.35em}
.sub{color:var(--muted);margin:.25rem 0 0}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip input:focus-visible+span{outline:3px solid var(--jade);outline-offset:2px}
.hz{font-family:var(--hanzi)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
nav.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--jade);color:var(--paper)}
nav.tabs #install{color:var(--jade)}
.settings{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:22px}
.settings .grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip > span{display:inline-block;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:.9rem;color:var(--muted);user-select:none}
.chip input:checked + span{border-color:var(--jade);background:var(--jade-soft);color:var(--jade)}
.chip .hz{font-weight:500;margin-right:4px;font-size:.95rem}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.skills{display:flex;flex-direction:column;gap:22px}
.skill h2{font-size:1rem;display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.skill h2 .hz{font-size:1.25rem;color:var(--jade)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.qcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:border-color .15s, transform .15s}
.qcard:hover{border-color:var(--jade);transform:translateY(-1px)}
.qcard b{font-size:1rem}
.qcard small{color:var(--muted);font-size:.86rem;line-height:1.4}
.qcard.feature{border-color:var(--jade);background:var(--jade-soft)}
.qcard.daily{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;border-width:2px}
.qcard.daily .ring{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--hanzi);font-size:1.6rem;color:var(--paper);background:var(--jade)}
.qcard.daily.done .ring{background:var(--ok)}
.qcard.daily .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.qcard.daily .stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qcard.daily .stats b{color:var(--ink)}
/* 田字格 */
.tzg{position:relative;display:grid;place-items:center;aspect-ratio:1;border:2px solid var(--grid);background:var(--card);max-width:100%}
.tzg::before,.tzg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(var(--grid-soft),var(--grid-soft)) center/100% 1px no-repeat,linear-gradient(var(--grid-soft),var(--grid-soft)) center/1px 100% no-repeat}
.tzg::after{background:linear-gradient(to top right,transparent calc(50% - .5px),var(--grid-soft) 50%,transparent calc(50% + .5px)),linear-gradient(to top left,transparent calc(50% - .5px),var(--grid-soft) 50%,transparent calc(50% + .5px));opacity:.8}
.tzg > *{position:relative;z-index:1}
.tzg .hz{line-height:1}
/* quiz */
.quiz{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:320px}
.bar i{display:block;height:100%;background:var(--jade);transition:width .25s}
.prompt{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin:6px 0 20px}
.prompt .tzg{width:128px}
.prompt .tzg .hz{font-size:84px}
.prompt .q{font-size:1.05rem;color:var(--muted);max-width:52ch}
.prompt .big{font-size:1.5rem;font-weight:600}
.prompt .sent{font-family:var(--hanzi);font-size:2rem;letter-spacing:.04em;line-height:1.3}
.prompt .gap{display:inline-block;min-width:1.2em;border-bottom:3px solid var(--jade);color:var(--jade)}
.prompt .exh{margin:0 0 6px}
.prompt .exd{display:flex;flex-direction:column;gap:6px;font-size:1.35rem;margin:6px 0}
.prompt .exd .who{font-size:.9rem;color:var(--muted);font-family:var(--body);margin-right:4px}
.prompt u{text-decoration-color:var(--jade);text-decoration-thickness:3px;text-underline-offset:6px}
.why{display:block;color:var(--muted);font-size:.9rem;margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r);padding:12px 14px;font-size:1.05rem;min-height:56px;text-align:center}
.opt.hzopt{font-family:var(--hanzi);font-size:1.9rem;line-height:1.1}
.opt:hover:not(:disabled){border-color:var(--jade)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{margin-top:16px;padding:12px 14px;border-radius:var(--r);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.feedback.ok{background:var(--ok-soft)} .feedback.no{background:var(--bad-soft)}
.feedback .verdict{font-weight:700}
.feedback.ok .verdict{color:var(--ok)} .feedback.no .verdict{color:var(--bad)}
.feedback .hz{font-size:1.35rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:16px}
.btn{border:1.5px solid var(--jade);background:var(--jade);color:var(--paper);padding:9px 18px;border-radius:999px;font-weight:600}
.btn.ghost{background:transparent;color:var(--jade)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--jade);background:transparent;color:var(--jade)}
.icon-btn.lg{width:72px;height:72px}
.icon-btn svg{width:55%;height:55%}
/* sentence builder */
.answer-line{min-height:64px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px 0;margin-bottom:14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tile{font-family:var(--hanzi);font-size:1.5rem;padding:6px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);line-height:1.3}
.tile:hover{border-color:var(--jade)}
.tile.used{visibility:hidden}
.answer-line .tile{background:var(--jade-soft);border-color:var(--jade)}
.pgap{display:inline-flex;align-items:baseline;gap:2px;min-width:2.6em;justify-content:center;font:inherit;color:var(--jade);background:transparent;border:0;border-bottom:3px solid var(--line);padding:0 4px;margin:0 2px;cursor:pointer}
.pgap small{font-family:var(--body);font-size:.75rem;color:var(--muted)}
.pgap.cur{border-bottom-color:var(--jade);background:var(--jade-soft)}
.pgap.right{border-bottom-color:var(--ok);color:var(--ok)} .pgap.wrong{border-bottom-color:var(--bad);color:var(--bad)}
.prompt .passage{font-size:1.5rem;line-height:2;text-align:left}
.readbox{text-align:left;font-family:var(--hanzi);font-size:1.25rem;line-height:1.9;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:6px 0 10px;max-height:40vh;overflow:auto}
.tile .abc{font-family:var(--body);font-size:.85rem;color:var(--muted);margin-right:4px}
.answer-line .punct{font-family:var(--hanzi);font-size:1.5rem;color:var(--muted)}
/* writing */
.writer-box{margin:0 auto}
.writer-box .tzg{width:100%}
.tzrow{display:flex;gap:4px;justify-content:center;width:100%}
.tzrow .tzg{flex:1 1 0;min-width:0}
.prompt .tzrow{width:auto}.prompt .tzrow .tzg{flex:none;width:76px}.prompt .tzrow .tzg .hz{font-size:50px}
.ccard .tzrow .tzg .hz{font-size:44px}
.detail .tzrow{width:auto}.detail .tzrow .tzg{flex:none}
.writer-box svg{display:block;width:100%;height:100%}
/* results */
.result-head{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-bottom:16px}
.score{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--jade);line-height:1}
.misslist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.misslist .hz{font-size:1.4rem}
.misslist .yours{color:var(--bad);font-size:.9rem}
/* character list */
.lesson-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.lesson-h:first-child{margin-top:0}
.lesson-h .hz{font-size:1.15rem}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0}
.ccard .tzg{width:100%}
.ccard .tzg .hz{font-size:44px}
.ccard .py{font-size:.9rem;font-weight:600}
.ccard .mn{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.25}
.ccard.weak .tzg{border-color:var(--bad)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:20px;width:min(420px,calc(100% - 32px))}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.detail{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.detail .tzg{width:180px}
.detail .words{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;font-size:.95rem}
.detail .words div{display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:6px}
.note{font-size:.85rem;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.dlist{display:flex;flex-direction:column;gap:10px}
.ditem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ditem .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ditem .preview{color:var(--muted);font-size:.92rem}
.btn.sm{padding:5px 12px;font-size:.88rem}
.chat{display:flex;flex-direction:column;gap:10px;margin:8px 0 16px}
.bubble{max-width:85%;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);align-self:flex-start}
.bubble.me{align-self:flex-end;background:var(--jade-soft);border-color:var(--jade)}
.bubble.miss{border-color:var(--bad)}
.bubble .who{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.bubble .zh{font-family:var(--hanzi);font-size:1.45rem;line-height:1.35}
.bubble .py{font-weight:600;font-size:.95rem}
.bubble .en{color:var(--muted);font-size:.9rem}
.bubble .icon-btn{width:28px;height:28px;border-width:1px}
.chat.hide-py .py,.chat.hide-en .en{display:none}
.turn{display:flex;flex-direction:column;gap:10px;padding:14px;border:1.5px dashed var(--jade);border-radius:var(--r)}
.turn input{font:inherit;font-size:1.2rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.turn input:focus-visible{outline:3px solid var(--jade);outline-offset:1px}
.selfcheck{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.selfcheck .mn{font-size:1.15rem;font-weight:600}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:520px){
  .opts{grid-template-columns:minmax(0,1fr)}
  .opts.hzset{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prompt .sent{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1><span class="zh">学中文</span>Learning Chinese</h1>
      <p class="sub">Practise reading, writing, listening and speaking with the characters and words from class. Choose your lessons, then pick a quiz.</p>
    </div>
    <nav class="tabs" role="tablist">
      <button id="tab-quiz" role="tab" aria-selected="true" data-view="home">Quizzes</button>
      <button id="tab-chars" role="tab" aria-selected="false" data-view="chars">Characters</button>
    </nav>
  </header>

  <div class="settings">
    <div class="grp"><span class="label">Lessons</span>
      <label class="chip" title="Lesson 1: Hello"><input type="checkbox" id="les1" value="1" checked><span><span class="hz">第1课</span><span class="hz">你好</span></span></label>
      <label class="chip" title="Lesson 2: How are you?"><input type="checkbox" id="les2" value="2" checked><span><span class="hz">第2课</span><span class="hz">你好吗</span></span></label>
      <label class="chip" title="Lesson 3: What do you want to eat?"><input type="checkbox" id="les3" value="3" checked><span><span class="hz">第3课</span><span class="hz">你吃什么</span></span></label>
      <label class="chip" title="Lesson 4: How much is it?"><input type="checkbox" id="les4" value="4" checked><span><span class="hz">第4课</span><span class="hz">多少钱</span></span></label>
      <label class="chip" title="Lesson 5: Where is the library?"><input type="checkbox" id="les5" value="5" checked><span><span class="hz">第5课</span><span class="hz">图书馆在哪儿</span></span></label>
      <label class="chip" title="Lesson 6: Let me introduce"><input type="checkbox" id="les6" value="6" checked><span><span class="hz">第6课</span><span class="hz">我来介绍一下儿</span></span></label>
      <label class="chip" title="Lesson 7: How is your health?"><input type="checkbox" id="les7" value="7" checked><span><span class="hz">第7课</span><span class="hz">你身体好吗</span></span></label>
      <span class="count" id="poolcount"></span>
    </div>
    <div class="grp"><span class="label">Questions</span>
      <label class="chip"><input type="radio" name="len" id="len10" value="10" checked><span>10</span></label>
      <label class="chip"><input type="radio" name="len" id="len20" value="20"><span>20</span></label>
      <label class="chip"><input type="radio" name="len" id="len40" value="40"><span>40</span></label>
    </div>
    <div class="grp"><span class="label">Typed pinyin</span>
      <label class="chip"><input type="radio" name="tones" id="tonesreq" value="1" checked><span>Tones required</span></label>
      <label class="chip"><input type="radio" name="tones" id="tonesopt" value="0"><span>Tones optional</span></label>
    </div>
  </div>

  <main id="view"></main>
</div>

<dialog id="dlg"><div class="detail" id="dlgbody"></div>
  <div class="actions"><button class="btn ghost" id="dlgclose">Close</button></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>
<script>
// Characters from the class PDFs plus the Lesson 3 vocabulary words. Pinyin is numbered; 5 = neutral tone.
const CH = [
  // Lesson 1 你好
  ['你','ni3','you',1], ['您','nin2','you (polite)',1], ['好','hao3','good, well',1], ['们','men5','plural suffix (-s)',1],
  ['老','lao3','old',1], ['师','shi1','teacher (as in 老师)',1], ['谢','xie4','thank',1], ['不','bu4','not, no',1],
  ['客','ke4','guest',1], ['气','qi4','air; manner (as in 客气)',1], ['对','dui4','correct; facing',1], ['起','qi3','rise (as in 对不起)',1],
  ['没','mei2','not (have)',1], ['关','guan1','close; concern',1], ['系','xi4','relation (as in 关系)',1], ['再','zai4','again',1],
  ['见','jian4','see, meet',1], ['请','qing3','please; invite',1], ['进','jin4','enter, come in',1], ['坐','zuo4','sit',1],
  ['听','ting1','listen',1], ['说','shuo1','speak, say',1], ['读','du2','read (aloud)',1], ['写','xie3','write',1], ['学生','xue2 sheng5','student',1],
  // Lesson 2
  ['吗','ma5','question particle (…?)',2], ['我','wo3','I, me',2], ['很','hen3','very',2], ['呢','ne5','particle: "and …?"',2],
  ['也','ye3','also, too',2], ['爸','ba4','dad',2], ['妈','ma1','mum',2], ['都','dou1','all, both',2],
  ['哥','ge1','older brother',2], ['弟','di4','younger brother',2], ['姐','jie3','older sister',2], ['妹','mei4','younger sister',2],
  ['他','ta1','he, him',2], ['她','ta1','she, her',2], ['它','ta1','it',2], ['爱','ai4','love',2],
  ['忙','mang2','busy',2], ['累','lei4','tired',2], ['饿','e4','hungry',2], ['渴','ke3','thirsty',2], ['人','ren2','person, people',2],
  // Lesson 3
  ['吃','chi1','eat',3], ['饺','jiao3','dumpling (as in 饺子)',3], ['饭','fan4','meal; cooked rice',3], ['面','mian4','noodles',3],
  ['喝','he1','drink',3], ['酒','jiu3','alcohol, liquor',3], ['茶','cha2','tea',3],
  // Lesson 3 vocabulary: learned as whole words, never split into characters. Syllables separated by spaces.
  ['什么','shen2 me5','what',3], ['饺子','jiao3 zi5','dumplings',3], ['米饭','mi3 fan4','cooked rice',3], ['面条','mian4 tiao2','noodles',3],

    {t:'我很饿，我吃饺子，不吃面条。我很渴，我不喝啤酒，我喝奶茶。我哥哥喝咖啡，他也吃包子。我买书，也买笔，不买词典。', en:"I'm hungry; I eat dumplings, not noodles. I'm thirsty; I don't drink beer, I drink milk tea. My older brother drinks coffee and also eats steamed buns. I buy books and pens, but not a dictionary.", qs:[

    {t:'我在北京理工大学。我的宿舍在七号楼，图书馆就在那儿，食堂也在那儿。我朋友在银行，我去邮局。', en:'I am at BIT. My dorm is in Building 7. The library is right there, and the dining hall is there too. My friend is at the bank; I am going to the post office.', qs:[

    {t:'我来介绍一下儿，我是保罗，我是德国人。我在北京理工大学学习汉语。这是我们的教室，教室很大。这是我的同学西蒙，他是法国人，他很帅。那是李英男，她是韩国人，她很漂亮。我们班的同学都很聪明。认识你们很高兴！', en:"Let me introduce myself: I'm Paul, I'm German. I study Chinese at BIT. This is our classroom; it's big. This is my classmate Simon, he is French and handsome. That is Li Yingnan, she is Korean and pretty. Everyone in our class is clever. Nice to meet you!", qs:[

    {t:'我是西蒙，我是北京理工大学的留学生。最近我身体很好，学习比较忙。我的成绩马马虎虎，我的同学都非常努力。我的宿舍不太大，宿舍里有空调，我没有同屋。宿舍离教室很近，离食堂不太远。', en:"I'm Simon, an international student at BIT. Lately my health is good and my studies are quite busy. My grades are so-so; my classmates all study very hard. My dorm isn't very big, it has air conditioning, and I don't have a roommate. The dorm is close to the classroom and not too far from the dining hall.", qs:[

    {t:'这是我的同屋莉莉，她是中国人。她头发很长，眼睛很大，个子不太高。她学习非常努力，成绩很好。我们的宿舍挺大的，宿舍里有电视，也有空调。我们学校的食堂也不错。', en:"This is my roommate Lily; she is Chinese. Her hair is long, her eyes are big, and she isn't very tall. She studies very hard and her grades are good. Our dorm is quite big; it has a TV and air conditioning. Our school's dining hall is good too.", qs:[

const DIG = '零一二三四五六七八九';

function zhToNum(x){ // shows a Chinese price as ¥ (used for the answer options); 二块 is wrong Chinese but still reads as 2
  const v = c => '一二三四五六七八九'.indexOf(c) + 1 || (c === '两' ? 2 : 0);
  const [kz, mz] = x.split('块'); let k = 0;
  if (kz === '一百') k = 100; else if (kz.startsWith('一百零')) k = 100 + v(kz.slice(3)); else if (kz.includes('十')) { const [a, b] = kz.split('十'); k = (a ? v(a) : 1) * 10 + (b ? v(b) : 0); } else k = v(kz);
  const m = mz ? v(mz.replace('毛', '')) : 0;
  return '¥' + (m ? `${k}.${m}0` : k);
}
function pricePy(zh){
  let out = '';
  [...zh].forEach((c, i) => { const n = zh[i + 1];
    let py = BY[c] ? BY[c].py : c;
    if (c === '一' && i === 0 && (n === '块' || n === '百')) py = n === '块' ? 'yí' : 'yì';

function pyOf(text){

  while (rest.length) {
    const w2 = WORDS.slice().sort((a,b) => b.w.length - a.w.length).find(x => rest.startsWith(x.w));

function start(id){
  if (id === 'dialogs') return dialogList();
  if (id === 'daily') return startDaily();
  if (id === 'examlist') return examList();
  if (id.startsWith('exam')) return startExam(id);
  const P = pools();
  let gens;
  if (id === 'prices' && !lessons().includes(4)) { view.innerHTML = '<div class="empty">Prices use Lesson 4. Tick 第4课 above, then start again.</div>'; return; }
  const mix = lessons().includes(4) ? [...MIX, 'prices', 'prices'] : MIX;
  if (id === 'mixed') gens = Array.from({length: qlen()}, (_, i) => mix[i % mix.length]);
  else if (id === 'weak') {
    const wk = Object.keys(weak).map(h => BY[h]).filter(Boolean);
    P.ch = wk; P.words = WORDS.filter(w => wk.some(c => w.w.includes(c.h)));
    gens = Array.from({length: qlen()}, (_, i) => ['recall','find','fromen','write','wordbuild'][i % 5]);
    if (!P.words.length) gens = gens.map(g => g === 'wordbuild' ? 'find' : g);
  } else gens = Array(qlen()).fill(id);
  if (!P.ch.length) { view.innerHTML = '<div class="empty">Pick at least one lesson first.</div>'; return; }
  const used = new Set(), items = [];
  const want = gens.length, order = shuffle(gens), dead = new Set();
  for (let k = 0; items.length < want && dead.size < order.length && k < want * 6; k++) {
    const g = order[k % order.length];
    if (dead.has(g)) continue;
    try { items.push(GEN[g](P, used)); } catch (e) { if (e !== NONE) throw e; dead.add(g); }
  }
  if (!items.length) { view.innerHTML = '<div class="empty">Not enough material for this quiz in the chosen lessons. Add another lesson above.</div>'; return; }
  const meta = QUIZZES.find(q => q.id === id);
  window.scrollTo(0, 0);
  Q = { id, name: meta ? meta.name : id === 'weak' ? 'My mistakes' : 'Mixed test', items, i:0, score:0, missed:[] };
  if (items.length < qlen()) Q.warn = `These lessons have ${items.length} different questions for this quiz, so it stops there. Add a lesson for more.`;
  if (id === 'listen' && !(hasSpeech())) Q.warn = 'This browser cannot play speech, so listening will not work here.';
  render();
}

// ---------- class test practice ----------
const NUMS = '一二三四五六七八九十';
const gapify = t => esc(t).replace('＿', '<span class="gap">？</span>');
const exLines = d => `<div class="exd">${d.map(([who, t]) => `<div>${who ? `<span class="who">${esc(who)}：</span>` : ''}<span class="hz">${gapify(t)}</span></div>`).join('')}</div>`;
const why = x => x.why ? `<span class="why">${esc(x.why)}</span>` : '';
function examItem(part, x){
  const head = `<p class="label exh"><span class="hz">${NUMS[paperOf(part).indexOf(part)]}、${part.zh}</span> · ${esc(part.en)}</p>`;
  const base = { keys:'', pts: part.pts, head };
  if (part.kind === 'part') { const cs = [...x.w], k = rnd(cs.length), ans = cs[k];
    const pool = uniq(examPool(part).flatMap(y => [...y.w])), all = uniq(part.items.flatMap(y => [...y.w]));
    const bad = ch => ch === ans || KNOWN.has(cs.map((c, i) => i === k ? ch : c).join(''));
    const look = LOOK.filter(g => g.includes(ans)).join('').split('').filter(c => pool.includes(c));
    const opts = [];
    [...shuffle(look), ...shuffle(pool), ...shuffle(all)].forEach(ch => { if (opts.length < 4 && !bad(ch) && !opts.includes(ch)) opts.push(ch); });
    const py = wordPy(x.w);
    return { ...base, type:'mc', hz:true, five:true, prompt:`${head}<p class="q">Which character completes the word?</p><p class="big">${py}</p><p class="sent">${cs.map((c, i) => i === k ? '<span class="gap">？</span>' : esc(c)).join('')}</p>`,
      opts: shuffle([ans, ...opts]).map(o => ({label:o, val:o})), ans, speak:x.w,
      reveal:`<span class="hz">${x.w}</span> <b>${py}</b> <span>${esc(wordMean(x.w))}</span>` }; }
  if (part.kind === 'read') return x.qs.map((q, j) => ({ ...base, type:'mc', hz:true, small:true,
    prompt:`${head}<div class="readbox">${esc(x.t).replace(/\n/g, '<br>')}</div><p class="q">${j + 1}）<span class="hz">${esc(q.q)}</span></p>`,
    opts: shuffle(q.o).map(o => ({label:o, val:o})), ans:q.o[0], speak:q.o[0],
    reveal:`<span class="hz">${q.o[0]}</span>${/[一-鿿]/.test(q.q) ? `<span class="why">${esc(q.q)} ${pyOf(q.q)}</span>` : ''}${j === x.qs.length - 1 ? `<span class="why">${esc(x.en)}</span>` : ''}` }));
  if (part.kind === 'passage') { const full = x.s.split('＿').map((t, i) => t + (x.a[i] || '')).join('');
    return { ...base, type:'passage', pts: part.pts * x.a.length, unit: part.pts, x, reveal:`<span class="hz">${esc(full)}</span> <span>${esc(x.en)}</span>` }; }
  if (part.kind === 'abcd') { const end = x.a[0].slice(-1);
    return { ...base, type:'build', abcd:true, why:x.why, s:{ t:[...x.w, end], text:x.a[0], alt:x.a, p:x.p, m:x.en } }; }
  if (part.kind === 'an') return { ...base, type:'type', q:'Change it into an affirmative-negative question (… 不 …)',
    x:{ d:[['', x.s + ' → ＿']], a:x.a, py:x.py, pyShow:pyOf(x.a[0]), en:(x.why ? x.why + ' ' : '') + 'Verb or adjective + 不 + the same word, and drop 吗. 有 becomes 有没有.' } };
  if (part.kind === 'mc' && x.q) return { ...base, type:'mc', prompt:`${head}<p class="q">Which pinyin is right?</p>${charBox(x.q)}`,
    opts: shuffle(x.o).map(p => ({label:p, val:p})), ans:x.o[x.a], speak:x.q,
    reveal:`<span class="hz">${x.q}</span> <b>${x.o[x.a]}</b> <span>${esc(x.en)}</span>${why(x)}` };
  if (part.kind === 'mc') { const a = x.o[x.a], full = x.d.map(([w, t]) => t.replace('＿', a));
    return { ...base, type:'mc', hz:true, small:x.o.some(o => o.length > 1), prompt:`${head}<p class="q">Choose the right word for the gap</p>${exLines(x.d)}`,
      opts: shuffle(x.o).map(o => ({label:o, val:o})), ans:a, speak:full.join(''),
      reveal:`<span class="hz">${full.join(' ')}</span> <span>${esc(x.en)}</span>${why(x)}` }; }
  if (part.kind === 'bank') { const full = x.s.replace('＿', x.a);
    return { ...base, type:'mc', hz:true, small:x.bank.some(o => o.length > 1), prompt:`${head}<p class="q">Which word fits the gap?</p><p class="sent">${gapify(x.s)}</p>`,
      opts: x.bank.map(o => ({label:o, val:o})), ans:x.a, speak:full,
      reveal:`<span class="hz">${full}</span> <b>${x.p}</b> <span>${esc(x.en)}</span>${why(x)}` }; }
  if (part.kind === 'under') return { ...base, type:'mc',
    prompt:`${head}<p class="q">Ask a question about the underlined part</p><p class="sent">${esc(x.s).replace(/\[(.+?)\]/, '<u>$1</u>')}</p>`,
    opts: shuffle(x.o).map(o => ({label:`<span class="hz" style="font-size:1.2rem">${o}</span>`, val:o})), ans:x.o[x.a], speak:x.o[x.a],
    reveal:`<span class="hz">${x.o[x.a]}</span> <b>${x.p}</b> <span>${esc(x.en)}</span>${why(x)}` };
  if (part.kind === 'order') { const end = x.a[0].slice(-1);
    return { ...base, type:'build', why:x.why, s:{ t:[...x.w, end], text:x.a[0], alt:x.a, p:x.p, m:x.en } }; }
  return { ...base, type:'type', x };
}
// each item belongs to the highest lesson among its words; part 6 reuses the sentence bank
EXAM.find(p => p.kind === 'order').items = SENTS.filter(x => x.t.length >= 4).map(x => ({ w: x.t.slice(0, -1), a: [x.text], p: x.p, en: x.m }));
EXAM.forEach(p => p.items.forEach(x => { x.l = lessonOf((JSON.stringify(x).match(/[一-鿿]+/g) || []).join('|')); }));
// quiz paper: the format of the weekly class quizzes
const QP = id => QUIZ.find(p => p.id === id);
const paperOf = part => QUIZ.includes(part) ? QUIZ : EXAM;
const NAMES = ['保罗','西蒙','李英男','莉莉'];
const KNOWN = new Set([...CH.map(c => c.h), ...WORDS.map(w => w.w), ...QUIZ_WORDS]);
const wordPy = w => BY[w] ? BY[w].py : (WORDS.find(x => x.w === w) || {}).p || pyOf(w);
const wordMean = w => BY[w] ? BY[w].m : (WORDS.find(x => x.w === w) || {}).m || '';
function pyLetters(text){ // plain pinyin letters, also for split words like 认不认识
  return split(text).map(u => { if (BY[u]) return BY[u].p; if (!/[一-鿿]/.test(u)) return '';
    const c = CH.find(c => c.n > 1 && c.h.includes(u)); return c ? c.syl[[...c.h].indexOf(u)] : ''; }).join(' ').replace(/\d/g, '');
}
QP('q1').items = uniq([...CH.filter(c => c.n > 1 && !NAMES.includes(c.h) && new Set(c.h).size > 1).map(c => c.h), ...QUIZ_WORDS]).map(w => ({ w, l: lessonOf(w) }));
QP('q2').items = EXAM.find(p => p.id === 't4').items;
QP('q4').items = EXAM.find(p => p.kind === 'order').items;
QP('q6').items.forEach(x => { x.py = x.a.map(pyLetters); });
QUIZ.forEach(p => p.items.forEach(x => { if (x.l == null) x.l = lessonOf((JSON.stringify(x).match(/[一-鿿]+/g) || []).join('|')); }));
const examPool = p => p.items.filter(x => lessons().includes(x.l));
const examSize = (p, x) => p.kind === 'passage' ? x.a.length : p.kind === 'read' ? x.qs.length : 1;
function examPick(p, lim){ // whole texts only, up to lim questions (always at least one)
  const out = []; let n = 0;
  shuffle(examPool(p)).forEach(x => { const k = examSize(p, x); if (!out.length || n + k <= lim) { out.push(x); n += k; } });
  return out;
}
function examList(){
  setTab('home'); $('.settings').hidden = false; Q = null;
  const units = p => examPool(p).reduce((n, x) => n + examSize(p, x), 0);
  const cards = (parts, P) => parts.map((p, i) => { const n = units(p), texts = examPool(p).length;
    const count = p.kind === 'passage' || p.kind === 'read' ? `${texts} text${texts === 1 ? '' : 's'}, ${n} ${p.kind === 'read' ? 'questions' : 'gaps'}` : `${n} question${n === 1 ? '' : 's'}`;
    return `<button class="qcard" data-start="exam-${p.id}" ${n ? '' : 'disabled style="opacity:.55"'}><b><span class="hz">${NUMS[i]}、${p.zh}</span></b><small>${esc(p.en)} · ${n ? count : p.id === 't2' ? 'needs 第4课 (measure words)' : p.id === 'q6' ? 'needs 第2课 or later' : 'none in these lessons'}</small></button>`; }).join('');
  const fullN = EXAM.reduce((n, p) => n + Math.min(p.full, examPool(p).length), 0);
  const fullPts = EXAM.reduce((n, p) => n + p.pts * Math.min(p.full, examPool(p).length), 0);
  const qN = QUIZ.some(p => examPool(p).length);
  view.innerHTML = `<div class="examlist"><div class="qtop" style="margin-bottom:12px"><span class="label">Class test practice</span><button class="btn ghost" id="home">All quizzes</button></div>
    <p class="note" style="margin:0 0 12px">Questions use only words from the lessons ticked above. Tick one lesson to focus on it, or several to mix them.</p>
    <p class="label">Quiz paper · like Quiz 2</p>
    <div class="qgrid"><button class="qcard feature" data-start="exam-Q" ${qN ? '' : 'disabled'}><b>Full quiz paper</b><small>All 6 parts in order, 2 points per answer like the real quiz.</small></button>
    ${cards(QUIZ)}</div>
    <p class="label" style="margin-top:20px">Test paper · like your class test</p>
    <div class="qgrid"><button class="qcard feature" data-start="exam-T" ${fullN ? '' : 'disabled'}><b>Full test paper · ${fullN} questions</b><small>All 7 parts in order, scored out of ${fullPts} points like the real test.</small></button>
    ${cards(EXAM)}</div></div>`;
}
function startExam(id){
  const part = [...QUIZ, ...EXAM].find(p => 'exam-' + p.id === id);
  const paper = id === 'exam-Q' ? QUIZ : EXAM;
  const items = part ? examPick(part, qlen()).flatMap(x => examItem(part, x))
    : paper.flatMap(p => examPick(p, p.full).flatMap(x => examItem(p, x)));
  if (!items.length) return examList();
  window.scrollTo(0, 0);
  Q = { id, name: part ? part.en : id === 'exam-Q' ? 'Full quiz paper' : 'Full test paper', items, i:0, score:0, missed:[], points:0, maxPts: items.reduce((n, x) => n + x.pts, 0) };
  render();
}
function examAnswerOk(v, x){
  if (/[一-鿿]/.test(v)) return x.a.some(a => normZh(a) === normZh(v));
  const p = normPy(v); return p.length > 0 && x.py.some(a => normPy(a) === p);
}
function renderPassage(it){
  const x = it.x, n = x.a.length, parts = x.s.split('＿'), fill = Array(n).fill(null);
  const bank = shuffle(x.a.map(w => w)); let cur = 0, done = false;
  view.innerHTML = frame(`<div class="prompt">${it.head}<p class="q">Fill each gap with one word from the box. Tap a gap to change it.</p>
      <div class="tiles" id="bank">${bank.map((w, j) => `<button class="tile" data-j="${j}">${w}</button>`).join('')}</div>
      <p class="sent passage" id="ptext"></p></div>
    <div id="fb"></div><div class="actions"><button class="btn ghost" id="clear">Clear</button><button class="btn" id="check" disabled>Check</button><button class="btn" id="next" hidden>Next</button></div>`);
  const draw = marks => {
    $('#ptext').innerHTML = parts.map((t, i) => esc(t) + (i < n ? `<button class="pgap${i === cur && !done ? ' cur' : ''}${marks ? (marks[i] ? ' right' : ' wrong') : ''}" data-i="${i}"><small>${i + 1}</small>${fill[i] != null ? bank[fill[i]] : '&nbsp;'}</button>` : '')).join('');
    view.querySelectorAll('#bank .tile').forEach(b => b.classList.toggle('used', fill.includes(+b.dataset.j)));
    $('#check').disabled = fill.some(f => f == null);
    view.querySelectorAll('.pgap').forEach(g => g.onclick = () => { if (done) return; const i = +g.dataset.i; fill[i] = null; cur = i; draw(); });
  };
  view.querySelectorAll('#bank .tile').forEach(b => b.onclick = () => {
    const j = +b.dataset.j; if (done || fill.includes(j)) return;
    fill[cur] = j; say(bank[j]); const nx = fill.findIndex(f => f == null); if (nx >= 0) cur = nx; draw(); });
  $('#clear').onclick = () => { if (done) return; fill.fill(null); cur = 0; draw(); };
  $('#check').onclick = () => {
    done = true; const marks = fill.map((f, i) => bank[f] === x.a[i]), right = marks.filter(Boolean).length;
    $('#check').hidden = true; $('#clear').hidden = true; draw(marks);
    const full = parts.map((t, i) => t + (x.a[i] || '')).join('');
    $('#fb').innerHTML = feedback(right === n, `<span class="why">${right} of ${n} gaps right: ${x.a.map((w, i) => `${i + 1} <span class="hz">${w}</span>`).join('，')}</span><span class="why">${esc(x.en)}</span>`,
      hasSpeech() ? ` <button class="icon-btn" data-say="${esc(full.replace(/[AB]：/g, ''))}" aria-label="Play sound">${SPEAK_SVG}</button>` : '');
    record(it, right === n, fill.map(f => bank[f]).join('、'), right * it.unit);
    nextBtn();
  };
  draw();
}
function renderType(it){
  const x = it.x;
  view.innerHTML = frame(`<div class="prompt">${it.head}<p class="q">${it.q ? esc(it.q) : `Finish the dialogue${x.note ? ` (${esc(x.note)})` : ''}`}</p>${exLines(x.d)}</div>
    <div class="turn"><input id="tin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing part in Hanzi or pinyin" aria-label="Your answer">
    <div class="actions" style="margin-top:0"><button class="btn ghost sm" id="tshow">Show answer</button><button class="btn" id="tcheck">Check</button></div></div>
    <div id="fb"></div><div class="actions"><button class="btn" id="next" hidden>Next</button></div>`);
  const inp = $('#tin'); inp.focus({ preventScroll: true });
  const full = x.d.map(([w, t]) => t.replace('＿', x.a[0])).join('');
  const finish = (ok, yours) => {
    inp.disabled = true; $('#tcheck').hidden = true; $('#tshow').hidden = true;
    const also = x.a.length > 1 ? `<span class="why">Also right: <span class="hz">${x.a.slice(1).join('、')}</span></span>` : '';
    $('#fb').innerHTML = feedback(ok, `<span class="hz">${x.a[0]}</span> <b>${x.pyShow || x.py[0]}</b> <span>${esc(x.en)}</span>${also}${!ok && yours ? `<span class="why">You wrote: ${esc(yours)}</span>` : ''}`,
      hasSpeech() ? ` <button class="icon-btn" data-say="${esc(full)}" aria-label="Play sound">${SPEAK_SVG}</button>` : '');
    record(it, ok, yours || '(answer shown)');
    nextBtn();
  };
  const check = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } finish(examAnswerOk(v, x), v); };
  $('#tcheck').onclick = check;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && !inp.disabled) check(); });
  $('#tshow').onclick = () => finish(false, '');
}

function startDaily(){
  const dp = dailyPlan();
  const items = [...shuffle(dp.review), ...dp.fresh].map(dailyItem);
  if (!items.length) { view.innerHTML = `<div class="empty">All done for today. 明天见！ See you tomorrow.<div class="actions" style="justify-content:center"><button class="btn ghost" id="home">All quizzes</button></div></div>`; return; }
  window.scrollTo(0, 0);
  Q = { id:'daily', name:'Daily review', items, i:0, score:0, missed:[], again:new Set() };
  render();
}

function frame(inner){
  $('.settings').hidden = true;
  const { i, items, name } = Q;
  return `<div class="quiz"><div class="qtop"><span class="label">${esc(name)} · ${i+1} / ${items.length}</span>
    <div class="bar"><i style="width:${i/items.length*100}%"></i></div>
    <button class="btn ghost" id="quit">Quit</button></div>${Q.warn ? `<p class="note">${Q.warn}</p>` : ''}${inner}</div>`;
}

function render(){
  if (Q.i >= Q.items.length) return results();
  const it = Q.items[Q.i];
  if (it.type === 'mc') renderMC(it);
  else if (it.type === 'build') renderBuild(it);
  else if (it.type === 'type') renderType(it);
  else if (it.type === 'passage') renderPassage(it);
  else if (it.type === 'recall') renderRecall(it);
  else if (it.type === 'fromen') renderFromEn(it);
  else renderWrite(it);
}

function feedback(ok, revealHtml, extra=''){
  return `<div class="feedback ${ok ? 'ok' : 'no'}" role="status"><span class="verdict">${ok ? '对！ Correct' : '不对 Not quite'}</span>${revealHtml}${extra}</div>`;
}
function nextBtn(){ const b = $('#next'); b.hidden = false; b.focus(); }
function record(it, ok, yours, pts){
  if (!it.retry) { if (ok) Q.score++; else Q.missed.push({ it, yours }); }
  if (pts != null) Q.points += pts; else if (ok && it.pts) Q.points += it.pts;
  noteResult(it.keys, ok);
  if (it.srs) srsUpdate(it.srs, ok);
  if (Q.id === 'daily' && !ok && it.srs && !Q.again.has(it.srs)) {
    // a missed item comes back once more at the end of today's round
    Q.again.add(it.srs);
    const again = GEN[shuffle(['meaning', 'find'])[0]]({ ...pools(), ch: [BY[it.srs]] }, new Set());
    again.retry = true; Q.items.push(again);
  }
}

function renderMC(it){
  const hzcls = it.hz ? 'hzopt' : '';
  view.innerHTML = frame(`<div class="prompt">${it.prompt}</div>
    <div class="opts ${it.hz && !it.small ? 'hzset' : ''}" ${it.five ? 'style="grid-template-columns:repeat(auto-fit,minmax(90px,1fr))"' : ''}>
      ${it.opts.map((o,k) => `<button class="opt ${hzcls}" data-k="${k}">${o.label}</button>`).join('')}</div>
    <div id="fb"></div><div class="actions"><button class="btn" id="next" hidden>Next</button></div>`);
  if (it.listen) setTimeout(() => say(it.listen), 200);
  view.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const o = it.opts[+b.dataset.k], ok = o.val === it.ans;
    view.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (it.opts[+x.dataset.k].val === it.ans) x.classList.add('right'); });
    if (!ok) b.classList.add('wrong');
    const spk = it.speak || it.listen;
    $('#fb').innerHTML = feedback(ok, it.reveal, spk && hasSpeech() ? ` <button class="icon-btn" data-say="${esc(spk)}" aria-label="Play sound">${SPEAK_SVG}</button>` : '');
    record(it, ok, o.val);
    nextBtn();
  });
}

function typedBox(placeholder, extra = ''){
  return `<div class="turn"><input id="tin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${placeholder}" aria-label="Your answer">
    <div class="actions" style="margin-top:0">${extra}<button class="btn ghost sm" id="tshow">I don't know</button><button class="btn" id="tcheck">Check</button></div></div>`;
}
function onTyped(check){
  const inp = $('#tin'); inp.focus({ preventScroll: true });
  const go = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } check(v); };
  $('#tcheck').onclick = go;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && !inp.disabled) go(); });
  return inp;
}
function lockTyped(){ $('#tin').disabled = true; $('#tcheck').hidden = true; $('#tshow').hidden = true; view.querySelectorAll('.turn .ghost').forEach(b => b.hidden = true); }
const sayBtn = h => hasSpeech() ? ` <button class="icon-btn" data-say="${esc(h)}" aria-label="Play sound">${SPEAK_SVG}</button>` : '';

function renderRecall(it){
  const c = it.c;
  view.innerHTML = frame(`<div class="prompt"><p class="q">Type the pinyin${tonesRequired() ? ' with tones (lǎoshī or lao3shi1)' : ' (tones optional)'}</p>${charBox(c.h)}</div>
    ${typedBox('Pinyin')}<div id="fb"></div><div id="self"></div><div class="actions"><button class="btn" id="next" hidden>Next</button></div>`);
  const meaningStep = (pyRight, yours) => {
    lockTyped(); say(c.h);
    $('#fb').innerHTML = `<div class="feedback ${pyRight ? 'ok' : 'no'}" role="status"><span class="verdict">${pyRight ? '对！ Pinyin correct' : '不对 The pinyin is'}</span><b>${c.py}</b>${!pyRight && yours ? `<span class="why">You wrote: ${esc(yours)}</span>` : ''}${sayBtn(c.h)}</div>`;
    if (!pyRight) { $('#self').innerHTML = `<div class="selfcheck"><span class="label">Meaning</span><span class="mn">${esc(c.m)}</span></div>`; record(it, false, yours || '(did not know)'); return nextBtn(); }
    $('#self').innerHTML = `<div class="selfcheck"><span class="label">Now, what does it mean? Say it in your head, then check.</span>
      <div class="actions" style="margin-top:0"><button class="btn" id="reveal">Show meaning</button></div></div>`;
    $('#reveal').onclick = () => {
      $('#self').innerHTML = `<div class="selfcheck"><span class="label">Meaning</span><span class="mn">${esc(c.m)}</span><span class="note">Did you know it?</span>
        <div class="actions" style="margin-top:0"><button class="btn ghost" id="knewno">Not quite</button><button class="btn" id="knewyes">I knew it</button></div></div>`;
      const done = ok => { $('#knewno').disabled = $('#knewyes').disabled = true; record(it, ok, ok ? yours : yours + ' (meaning not known)'); nextBtn(); };
      $('#knewyes').onclick = () => done(true); $('#knewno').onclick = () => done(false);
      $('#knewyes').focus();
    };
    $('#reveal').focus();
  };
  onTyped(v => meaningStep(pinyinOk(v, c), v));
  $('#tshow').onclick = () => meaningStep(false, '');
}

function renderFromEn(it){
  const c = it.c;
  view.innerHTML = frame(`<div class="prompt"><p class="q">Type this ${kind(c)} in Hanzi</p><p class="big">${esc(c.m)}</p><p class="note" id="pyhint" hidden>${c.py}</p></div>
    ${typedBox('Use your Chinese keyboard', '<button class="btn ghost sm" id="hintpy">Show pinyin</button>')}<div id="fb"></div><div class="actions"><button class="btn" id="next" hidden>Next</button></div>`);
  let hinted = false;
  $('#hintpy').onclick = () => { hinted = true; $('#pyhint').hidden = false; $('#hintpy').hidden = true; $('#tin').focus(); };
  const finish = (ok, yours) => {
    lockTyped();
    $('#fb').innerHTML = feedback(ok, info(c) + (ok && hinted ? '<span class="why">With the pinyin hint</span>' : '') + (!ok && yours ? `<span class="why">You wrote: <span class="hz">${esc(yours)}</span></span>` : ''), sayBtn(c.h));
    record(it, ok && !hinted, yours || '(did not know)');
    nextBtn();
  };
  onTyped(v => {
    const z = normZh(v);
    if (!z) { $('#fb').innerHTML = '<p class="note">Type Chinese characters: switch your keyboard to Chinese (pinyin) first.</p>'; return; }
    finish(z === c.h || (BY[z] && BY[z].m === c.m), z);
  });
  $('#tshow').onclick = () => finish(false, '');
}

function renderBuild(it){
  const s = it.s, end = s.t[s.t.length-1];
  const tiles = s.t.slice(0, -1).map((t,k) => ({t,k}));
  let order = shuffle(tiles);
  if (order.map(x => x.t).join('') === tiles.map(x => x.t).join('') && tiles.length > 1) order = [...order.slice(1), order[0]];
  const picked = [], ABC = 'ABCDEFGHIJ';
  const lab = k => it.abcd ? `<span class="abc">${ABC[order.findIndex(x => x.k === k)]}</span>` : '';
  const letters = ks => ks.map(k => ABC[order.findIndex(x => x.k === k)]).join('');
  view.innerHTML = frame(`<div class="prompt">${it.head || ''}${it.abcd
      ? `<p class="q">Put the words in order to make a sentence</p><button class="btn ghost" id="hint">Show English</button><p class="note" id="hinttxt" hidden>${esc(s.m)}</p>`
      : `<p class="q">Build the sentence in Chinese</p><p class="big">${esc(s.m)}</p><button class="btn ghost" id="hint">Show pinyin</button><p class="note" id="hinttxt" hidden>${s.p}</p>`}</div>
    <div class="answer-line" id="line"></div>
    <div class="tiles" id="tiles">${order.map(x => `<button class="tile" data-k="${x.k}">${lab(x.k)}${x.t}</button>`).join('')}</div>
    <div id="fb"></div><div class="actions"><button class="btn ghost" id="clear">Clear</button><button class="btn" id="check" disabled>Check</button><button class="btn" id="next" hidden>Next</button></div>`);
  const line = $('#line');
  const draw = () => {
    line.innerHTML = picked.map((k,j) => `<button class="tile" data-j="${j}">${lab(k)}${tiles[k].t}</button>`).join('') + (picked.length === tiles.length ? `<span class="punct">${end}</span>` : '');
    view.querySelectorAll('#tiles .tile').forEach(b => b.classList.toggle('used', picked.includes(+b.dataset.k)));
    $('#check').disabled = picked.length !== tiles.length;
    line.querySelectorAll('.tile').forEach(b => b.onclick = () => { if (line.dataset.done) return; picked.splice(+b.dataset.j, 1); draw(); });
  };
  view.querySelectorAll('#tiles .tile').forEach(b => b.onclick = () => { if (line.dataset.done || picked.includes(+b.dataset.k)) return; picked.push(+b.dataset.k); say(tiles[+b.dataset.k].t); draw(); });
  $('#hint').onclick = () => { $('#hinttxt').hidden = false; $('#hint').hidden = true; };
  $('#clear').onclick = () => { if (line.dataset.done) return; picked.length = 0; draw(); };
  $('#check').onclick = () => {
    const yours = picked.map(k => tiles[k].t).join('') + end;
    const ok = yours === s.text || (s.alt || []).includes(yours);
    line.dataset.done = 1; $('#check').hidden = true; $('#clear').hidden = true;
    const abcd = it.abcd ? `<span class="why">Answer: <b>${letters(tiles.map(x => x.k))}</b>${ok ? '' : ` · yours: ${letters(picked)}`} · ${esc(s.m)}</span>` : '';
    $('#fb').innerHTML = feedback(ok, `<span class="hz">${s.text}</span> <b>${s.p}</b>${abcd}${s.alt && s.alt.length > 1 ? `<span class="why">Also right: <span class="hz">${s.alt.slice(1).join(' ')}</span></span>` : ''}${it.why ? `<span class="why">${esc(it.why)}</span>` : ''}`, hasSpeech() ? ` <button class="icon-btn" data-say="${s.text}" aria-label="Play sound">${SPEAK_SVG}</button>` : '');
    record(it, ok, yours);
    nextBtn();
  };
  draw();
}

function renderWrite(it){
  const c = it.c, w = it.w, chars = [...c.h];
  const ctx = w ? `<p class="note">as in <span class="hz" style="font-size:1.1rem">${w.w.replace(c.h,'＿')}</span> ${w.p} (${esc(w.m)})</p>` : '';
  view.innerHTML = frame(`<div class="prompt"><p class="q">Write this ${kind(c)}. Draw each stroke in order${c.n > 1 ? ', one box at a time' : ''}.</p><p class="big">${c.py} · ${esc(c.m)}</p>${ctx}</div>
    <div class="writer-box" style="width:min(${c.n === 1 ? 260 : 170 * c.n}px,100%)"><div class="tzrow">${chars.map(() => '<div class="tzg"></div>').join('')}</div></div>
    <div id="fb"></div><div class="actions"><button class="btn ghost" id="outline">Show faint outline</button><button class="btn ghost" id="giveup">Show me</button><button class="btn" id="next" hidden>Next</button></div>`);
  const boxes = [...view.querySelectorAll('.writer-box .tzg')];
  let done = false, hinted = false, idx = 0, total = 0;
  const finish = (ok, note) => {
    if (done) return; done = true;
    $('#outline').hidden = true; $('#giveup').hidden = true;
    $('#fb').innerHTML = feedback(ok, info(c), note ? ` <span class="note">${note}</span>` : '');
    record(it, ok, ok ? c.h : '(could not write)');
    nextBtn();
  };
  const wrs = boxes.map((b, i) => makeWriter(b, chars[i], {showCharacter:false, showOutline:false, showHintAfterMisses:3, highlightOnComplete:true}));
  if (!wrs.every(Boolean)) {
    boxes.forEach(b => b.innerHTML = '');
    boxes[0].innerHTML = `<span class="note" style="padding:12px">The stroke checker did not load. Write ${c.py} on paper, then tap Show me.</span>`;
    $('#outline').hidden = true;
    $('#giveup').onclick = () => { boxes.forEach((b, i) => b.innerHTML = `<span class="hz" style="font-size:${Math.round(b.clientWidth*.66)}px">${chars[i]}</span>`); finish(true, 'Compare with what you wrote.'); };
    return;
  }
  const quizNext = () => {
    if (idx >= wrs.length) {
      const ok = total <= 3 * wrs.length && !hinted;
      return finish(ok, `${total} stroke ${total === 1 ? 'mistake' : 'mistakes'}${hinted ? ', with outline' : ''}.`);
    }
    boxes.forEach((b, i) => b.style.borderColor = i === idx ? 'var(--jade)' : '');
    wrs[idx].quiz({ onComplete: ({totalMistakes}) => { total += totalMistakes; idx++; quizNext(); } });
  };
  quizNext();
  $('#outline').onclick = () => { hinted = true; wrs.forEach(w => w.showOutline()); $('#outline').disabled = true; };
  $('#giveup').onclick = () => { if (idx < wrs.length) wrs[idx].cancelQuiz(); boxes.forEach(b => b.style.borderColor = ''); animSeq(wrs); finish(false, 'Watch the stroke order, then try it again on paper.'); };
}

function results(){
  $('.settings').hidden = true;
  const { score, missed } = Q, items = Q.items.filter(x => !x.retry);
  const pct = Math.round(score / items.length * 100);
  if (Q.id === 'daily') { const t = today(); if (streak.last !== t) { streak.n = streak.last === t - 1 ? streak.n + 1 : 1; streak.last = t; saveSrs(); } }
  const pts = Q.maxPts ? `<p class="note">Test score: <b>${Q.points}</b> / ${Q.maxPts} points</p>` : '';
  const again = Q.id === 'daily' ? `<p class="note">🔥 ${streak.n} day streak. Your next review is ready tomorrow.</p>` : '';
  const msg = pct === 100 ? '太好了！ Perfect.' : pct >= 80 ? '很好！ Very good.' : pct >= 50 ? 'Good start. Review the ones below.' : 'Keep going. Study the list below, then try again.';
  const row = ({it, yours}) => {
    if (it.type === 'build') return `<li><span class="hz">${it.s.text}</span><b>${it.s.p}</b><span>${esc(it.s.m)}</span><span class="yours">You built: <span class="hz" style="font-size:1rem">${esc(yours)}</span></span></li>`;
    if (it.type === 'recall' || it.type === 'fromen') return `<li>${info(it.c)}<span class="yours">You wrote: ${esc(yours)}</span></li>`;
    if (it.type === 'type') return `<li><span class="hz">${it.x.d.map(([w, t]) => t.replace('＿', it.x.a[0])).join(' ')}</span><span>${esc(it.x.en)}</span><span class="yours">You wrote: ${esc(yours)}</span></li>`;
    if (it.type === 'write') return `<li>${info(it.c)}<span class="yours">Write it 5 times on paper</span></li>`;
    return `<li>${it.reveal}<span class="yours">You chose: ${esc(yours)}</span></li>`;
  };
  view.innerHTML = `<div class="quiz"><div class="result-head"><div class="score">${score}/${items.length}</div><div><b>${msg}</b><div class="note">${esc(Q.name)} · ${pct}%</div></div></div>
    ${pts}${again}${missed.length ? `<p class="label">Review these</p><ul class="misslist">${missed.map(row).join('')}</ul>` : ''}
    <div class="actions"><button class="btn ghost" id="home">All quizzes</button>${Q.id.startsWith('exam') ? '<button class="btn ghost" data-start="examlist">Class test practice</button>' : ''}${Q.id === 'daily' ? '' : `<button class="btn" data-start="${Q.id}">Try again</button>`}</div></div>`;
  Q = null;
}

// ---------- dialogues ----------
DIALOGS.forEach(dg => dg.l = lessonOf(dg.lines.map(x => x.zh).join('')));
const speakers = dg => [...new Set(dg.lines.map(x => x.who))];
const normZh = t => t.replace(/[^一-鿿]/g, '');
const normPy = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ü/g, 'u').replace(/v/g, 'u').replace(/[^a-z]/g, '');
function lineOk(input, line){
  if (/[一-鿿]/.test(input)) return normZh(input) === normZh(line.zh);
  const v = normPy(input);
  return v.length > 0 && v === normPy(line.py);
}
function bubble(x, me, extra = ''){
  return `<div class="bubble ${me ? 'me' : ''} ${extra}"><span class="who">${esc(x.who)}${hasSpeech() ? ` <button class="icon-btn" data-say="${esc(x.zh)}" aria-label="Play line">${SPEAK_SVG}</button>` : ''}</span>
    <span class="zh">${x.zh}</span><span class="py">${x.py}</span><span class="en">${esc(x.en)}</span></div>`;
}
const playButtons = (i, dg, cls = 'btn') => speakers(dg).map(w => `<button class="${cls}" data-dplay="${i}" data-role="${esc(w)}">Play as ${esc(w)}</button>`).join('');
function dialogList(){
  setTab('home'); $('.settings').hidden = false; Q = null;
  const max = Math.max(...lessons());
  const list = DIALOGS.map((dg, i) => ({dg, i})).filter(({dg}) => dg.l <= max);
  view.innerHTML = `<div class="qtop" style="margin-bottom:12px"><span class="label">Dialogues · ${list.length}</span><button class="btn ghost" id="home">All quizzes</button></div>
    <p class="note" style="margin:0 0 12px">Read a conversation first, then role-play one side. On your turn, type your line in Hanzi or in pinyin (tone marks optional).</p>
    <div class="dlist">${list.map(({dg, i}) => `<div class="ditem"><div class="row"><b>${esc(dg.title)}</b><span class="note">${lname(dg.l)} · ${dg.lines.length} lines</span></div>
      <div class="preview"><span class="hz">${dg.lines[0].zh}</span> ${esc(dg.lines[0].en)}</div>
      <div class="row"><button class="btn ghost sm" data-dread="${i}">Read</button>${playButtons(i, dg, 'btn sm')}</div></div>`).join('')}</div>`;
}
function playAll(lines, i = 0){
  if (i >= lines.length || !hasSpeech()) return;
  try { if (i === 0) speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(lines[i].zh); u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice; u.rate = .75;
    u.onend = () => setTimeout(() => playAll(lines, i + 1), 350); speechSynthesis.speak(u); } catch(e){}
}
function readDialog(i){
  const dg = DIALOGS[i], who0 = dg.lines[0].who;
  $('.settings').hidden = true; window.scrollTo(0, 0);
  view.innerHTML = `<div class="quiz"><div class="qtop"><span class="label">${esc(dg.title)}</span><button class="btn ghost" id="dback">Dialogues</button></div>
    <div class="toggles">${hasSpeech() ? '<button class="btn sm" id="dplayall">Play all</button>' : ''}<button class="btn ghost sm" id="tpy">Hide pinyin</button><button class="btn ghost sm" id="ten">Hide English</button></div>
    <div class="chat" id="chat">${dg.lines.map(x => bubble(x, x.who !== who0)).join('')}</div>
    <div class="actions">${playButtons(i, dg)}</div></div>`;
  const chat = $('#chat');
  $('#tpy').onclick = e => { chat.classList.toggle('hide-py'); e.target.textContent = chat.classList.contains('hide-py') ? 'Show pinyin' : 'Hide pinyin'; };
  $('#ten').onclick = e => { chat.classList.toggle('hide-en'); e.target.textContent = chat.classList.contains('hide-en') ? 'Show English' : 'Hide English'; };
  if ($('#dplayall')) $('#dplayall').onclick = () => playAll(dg.lines);
}
function playDialog(i, role){
  const dg = DIALOGS[i];
  const st = { k: 0, score: 0, mine: dg.lines.filter(x => x.who === role).length };
  $('.settings').hidden = true; window.scrollTo(0, 0);
  view.innerHTML = `<div class="quiz"><div class="qtop"><span class="label">${esc(dg.title)} · you are ${esc(role)}</span><button class="btn ghost" id="dback">Dialogues</button></div>
    <div class="chat" id="chat"></div><div id="turn"></div></div>`;
  const chat = $('#chat'), turn = $('#turn');
  const done = () => {
    turn.innerHTML = `<div class="result-head" style="margin-top:8px"><div class="score">${st.score}/${st.mine}</div><div><b>${st.score === st.mine ? '太好了！ Perfect.' : 'Practise the lines in red, then try again.'}</b><div class="note">Lines you typed right without help</div></div></div>
      <div class="actions"><button class="btn ghost" data-dread="${i}">Read it again</button>${playButtons(i, dg)}</div>`;
  };
  const step = () => {
    let last = null;
    while (st.k < dg.lines.length && dg.lines[st.k].who !== role) { last = dg.lines[st.k]; chat.insertAdjacentHTML('beforeend', bubble(last, false)); st.k++; }
    if (last) say(last.zh);
    if (st.k >= dg.lines.length) return done();
    const line = dg.lines[st.k];
    const others = uniq(shuffle(DIALOGS.flatMap(d => d.lines).map(x => x.zh)).filter(z => normZh(z) !== normZh(line.zh)));
    const choices = shuffle([line.zh, ...others.slice(0, 2)]);
    let hinted = false;
    turn.innerHTML = `<div class="turn"><span class="label">Your turn · say this in Chinese</span><b>${esc(line.en)}</b>
      <input id="din" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type in Hanzi or pinyin" aria-label="Your line">
      <div class="toggles" id="dchoices" hidden>${choices.map(c => `<button class="opt hzopt" style="font-size:1.2rem;min-height:44px" data-pick="${esc(c)}">${c}</button>`).join('')}</div>
      <div class="actions" style="margin-top:0"><button class="btn ghost sm" id="dhint">Show choices</button><button class="btn ghost sm" id="dshow">Show answer</button><button class="btn" id="dcheck">Check</button></div></div>`;
    const inp = $('#din'); inp.focus({ preventScroll: true }); turn.scrollIntoView({ block: 'nearest' });
    const finishTurn = (ok, yours) => {
      if (ok && !hinted) st.score++;
      chat.insertAdjacentHTML('beforeend', bubble(line, true, ok ? '' : 'miss'));
      say(line.zh); st.k++;
      turn.innerHTML = `<div class="feedback ${ok ? 'ok' : 'no'}"><span class="verdict">${ok ? (hinted ? '对 Correct, with choices' : '对！ Correct') : '不对 Here is the line'}</span>${!ok && yours ? `<span class="note">You wrote: ${esc(yours)}</span>` : ''}</div>
        <div class="actions"><button class="btn" id="dnext">${st.k >= dg.lines.length ? 'Finish' : 'Continue'}</button></div>`;
      $('#dnext').focus({ preventScroll: true }); $('#dnext').onclick = step;
    };
    const check = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } finishTurn(lineOk(v, line), v); };
    $('#dcheck').onclick = check;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) check(); });
    $('#dhint').onclick = () => { hinted = true; $('#dchoices').hidden = false; $('#dhint').hidden = true; };
    $('#dchoices').onclick = e => { const b = e.target.closest('[data-pick]'); if (b) finishTurn(b.dataset.pick === line.zh, b.dataset.pick); };
    $('#dshow').onclick = () => finishTurn(false, '');
  };
  step();
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.say) return say(t.dataset.say);
  if (t.dataset.start) return start(t.dataset.start);
  if (t.dataset.char) return openChar(t.dataset.char);
  if (t.dataset.dread) return readDialog(+t.dataset.dread);
  if (t.dataset.dplay) return playDialog(+t.dataset.dplay, t.dataset.role);
  if (t.id === 'dback') return dialogList();
  if (t.dataset.view) { Q = null; return t.dataset.view === 'chars' ? chars() : home(); }
  if (t.id === 'quit' || t.id === 'home') { Q = null; return home(); }
  if (t.id === 'next') { Q.i++; return render(); }
  if (t.id === 'dlgclose') { $('#dlg').close(); }
});
if (store('hanzi-tones') === 0) $('#tonesopt').checked = true;
document.querySelectorAll('input[name="tones"]').forEach(r => r.addEventListener('change', () => store('hanzi-tones', tonesRequired() ? 1 : 0)));
document.querySelectorAll('.settings input').forEach(inp => inp.addEventListener('change', () => {
  if (!lessons().length) { inp.checked = true; }
  updateCount();
  if (!Q && $('#tab-chars').getAttribute('aria-selected') === 'true') chars();
  else if (!Q && document.querySelector('.dlist')) dialogList();
  else if (!Q && document.querySelector('.qcard.daily')) home();
  else if (!Q && document.querySelector('.examlist')) examList();
}));
function updateCount(){ $('#poolcount').textContent = pools().ch.length + ' to learn'; }
updateCount();
home();
})();
</script>

<script>
// Offline + install. The "Install app" button shows only where the browser offers it (Android, desktop Chrome/Edge).
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
let installEvt = null;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  if (document.getElementById('install')) return;
  const b = document.createElement('button'); b.id = 'install'; b.textContent = 'Install app';
  b.onclick = async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; b.remove(); };
  document.querySelector('nav.tabs').appendChild(b);
});
addEventListener('appinstalled', () => { const b = document.getElementById('install'); if (b) b.remove(); });
</script>
